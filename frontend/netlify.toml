# Netlify config for the MindEase frontend (Vite + React SPA).
# Set VITE_API_BASE_URL in the Netlify dashboard (Site settings -> Environment variables)
# to the deployed backend URL, e.g. https://mindease-backend.onrender.com

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# netlify/functions/send-email.mjs sends the signup OTP emails via Gmail (Nodemailer) for
# the Render backend. Set GMAIL_USER, GMAIL_APP_PASSWORD and EMAIL_RELAY_SECRET in the
# Netlify dashboard. Served at /.netlify/functions/send-email.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["nodemailer"]

# SPA fallback: every route serves index.html so client-side routing works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
